name: Lab 3 - Flask CI

on:
  push:
    branches: [master, main]
    paths:
      - "lab3/**"
      - ".github/workflows/ci-native.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "lab3/**"
      - ".github/workflows/ci-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: lab3

    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/todo-ci.sqlite
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab3/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate Python code
        run: python -m compileall -q application manage.py

      - name: Initialize SQLite database
        run: |
          python - <<'PY'
          from application import create_app
          from application.extensions import db
          from application.models import Todo
          from sqlalchemy import inspect

          app = create_app("production")
          with app.app_context():
              db.create_all()
              assert Todo.__tablename__ in inspect(db.engine).get_table_names()
              print("SQLite database initialized successfully")
          PY

      - name: Smoke test Flask server
        run: |
          python manage.py > flask.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat flask.log' EXIT

          curl --fail --show-error --silent \
            --retry 15 \
            --retry-connrefused \
            --retry-delay 1 \
            --retry-max-time 30 \
            --max-time 5 \
            --output response.html \
            --write-out 'HTTP %{http_code}\n' \
            http://127.0.0.1:7345/

          test -s response.html
          echo "Smoke test passed"
